services:
  - type: web
    name: atlas-estates-online
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: 'true'
      - key: WEB_DIST_PATH
        value: apps/web/dist
      - key: DATABASE_DISABLED
        value: 'false'
      - key: DATABASE_REQUIRED
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
